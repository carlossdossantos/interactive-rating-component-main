<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge - Interactive Rating Component Main</title>
    <link
      rel="shortcut icon"
      href="./src/images/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
       <section class="card">
         <div class="icon-star">
            <img src="./src/images/icon-star.svg" alt="Icon Star" />
         </div>
    
        <div class="middle-card">
            <h1 class="question">How did we do?</h1>

            <p class="text">
        Please let us know how we did with your support request. All feedback is
        appreciated to help us improve our offering!
            </p>

      <div class="numbers" role="radiogroup" aria-labelledby="rating-label">
        <p id="rating-label" class="sr-only">Rate this item from 1 to 5</p>
        <button type="button" class="number1" role="radio" aria-checked="false" aria-label="Rate 1">1</button>
        <button type="button" class="number2" role="radio" aria-checked="false" aria-label="Rate 2">2</button>
        <button type="button" class="number3" role="radio" aria-checked="false" aria-label="Rate 3">3</button>
        <button type="button" class="number4" role="radio" aria-checked="false" aria-label="Rate 4">4</button>
        <button type="button" class="number5" role="radio" aria-checked="false" aria-label="Rate 5">5</button>
      </div>
      <p class="error-message display-none" role="alert" aria-live="assertive" tabindex="-1"></p>
      </div>

      <button type="button" class="btnSubmit">Submit</button>
      <div class="thank-you-state" aria-live="polite"></div>
      </section>
    </main>
    <script src="./src/js/index.js"></script>
  </body>
</html>

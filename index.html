<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge - Interactive Rating Component Main</title>
    <link
      rel="shortcut icon"
      href="./src/images/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="card">
    <div class="icon-star">
        <img src="./src/images/icon-star.svg" alt="Icon Star" />
    </div>
    
    <div class="middle-card">
      <h1 class="question">How did we do?</h1>

      <p class="text">
        Please let us know how we did with your support request. All feedback is
        appreciated to help us improve our offering!
      </p>

      <div class="numbers">
        <button class="number1">1</button>
        <button class="number2">2</button>
        <button class="number3">3</button>
        <button class="number4">4</button>
        <button class="number5">5</button>
      </div>
      </div>

      <button class="btnSubmit">Submit</button>
      <div class="thank-you-state"></div>
    </main>
    <script src="./src/js/index.js"></script>
  </body>
</html>
